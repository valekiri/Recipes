<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap">
<style>
:root{
  --bg:#F8EEF1; --card:#FFFFFF; --ink:#2B1019; --muted:#7A5563; --line:#E6CFD7;
  --beet:#8E1B4A; --dill:#3E6B3B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D0C14; --card:#2B1520; --ink:#F7E9EE; --muted:#C3A0AF; --line:#4A2635;
    --beet:#E0628E; --dill:#8FC58A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D0C14; --card:#2B1520; --ink:#F7E9EE; --muted:#C3A0AF; --line:#4A2635;
  --beet:#E0628E; --dill:#8FC58A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.5 Figtree,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 48px}
h1{font:700 38px/1.1 Fraunces,Georgia,serif;margin:0 0 6px}
.sub{color:var(--muted);font-size:16px;margin:0 0 26px}
.list{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--line)}
.list li{border-top:1px solid var(--line)}
.recipe{display:block;padding:20px 8px;color:inherit;text-decoration:none;border-left:4px solid transparent}
.recipe:hover,.recipe:active{background:var(--card);border-left-color:var(--beet)}
.recipe:focus-visible{outline:3px solid var(--dill);outline-offset:-3px}
.recipe h2{font:700 26px/1.2 Fraunces,Georgia,serif;margin:0 0 4px;color:var(--beet)}
.recipe p{margin:0;color:var(--muted);font-size:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Recipes</h1>
  <p class="sub">Step-by-step cooking. Pick a recipe to start.</p>

  <!-- To add a recipe: copy one <li> block below, change the link and text, and paste it at the end of the list. -->
  <ul class="list">
    <li>
      <a class="recipe" href="borscht.html">
        <h2>Borscht</h2>
        <p>Beet and vegetable soup. 8 steps, with timers.</p>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
